name: Build Device Binary

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-device.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: goto-bus-stop/setup-zig@v2
      - name: Configure Zig cross linker
        run: |
          mkdir -p "$RUNNER_TEMP/zig-cc"
          cat > "$RUNNER_TEMP/zig-cc/aarch64-linux-musl-gcc" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail

          args=()
          skip_next=0
          for arg in "$@"; do
            if [ "$skip_next" -eq 1 ]; then
              skip_next=0
              continue
            fi
            case "$arg" in
              --target=aarch64-unknown-linux-musl|-target=aarch64-unknown-linux-musl)
                ;;
              --target|-target)
                skip_next=1
                ;;
              *)
                args+=("$arg")
                ;;
            esac
          done

          exec zig cc -target aarch64-linux-musl "${args[@]}"
          SH
          chmod +x "$RUNNER_TEMP/zig-cc/aarch64-linux-musl-gcc"
          echo "$RUNNER_TEMP/zig-cc" >> "$GITHUB_PATH"
          echo "CC_aarch64_unknown_linux_musl=$RUNNER_TEMP/zig-cc/aarch64-linux-musl-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=$RUNNER_TEMP/zig-cc/aarch64-linux-musl-gcc" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: device-${{ matrix.target }}
      - name: Build CLI
        run: cargo build --release -p office2pdf-cli --target ${{ matrix.target }}
      - name: Package artifact
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/office2pdf dist/office2pdf-${{ matrix.target }}
          chmod +x dist/office2pdf-${{ matrix.target }}
          (cd dist && sha256sum office2pdf-${{ matrix.target }} > office2pdf-${{ matrix.target }}.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: office2pdf-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
